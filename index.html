<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Shambhavi Singh - From Forest to Function</title>

    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:wght@300;400;600&family=Lora:wght@400;500&family=Tangerine:wght@700&display=swap" rel="stylesheet">
    
    <link rel="stylesheet" href="styles.css">
</head>
<body>

    <section id="hero">
        <!-- Background elements -->
        <div class="paper-texture"></div>
        <div class="coffee-stain top-left"></div>

        <div class="raven" id="raven">
            <svg width="60" height="60" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1">
                <path d="M12 2C6.48 2 2 6.48 2 12s4.48 10 10 10 10-4.48 10-10S17.52 2 12 2z"/>
                <circle cx="9" cy="10" r="1.5" class="raven-eye"/>
                <circle cx="15" cy="10" r="1.5" class="raven-eye"/>
            </svg>
        </div>

        <div class="hero-content">
            <p class="hero-subtitle">From Forest to Function</p>
            
            <h1 class="hero-name">Shambhavi Singh</h1>
            
            <p class="hero-specs">Builder &nbsp;•&nbsp; Researcher &nbsp;•&nbsp; Forest Dweller</p>
            
            <p class="hero-location">Teliamura Reserved Forest<br>Tripura, India</p>
        </div>

        <a href="#story" class="scroll-indicator">
            <span class="scroll-text">Explore the Work</span>
            <svg class="scroll-arrow" width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                <path d="M12 5v14M19 12l-7 7-7-7"/>
            </svg>

            <div class="ink-splatter"></div>
        </a>

        <div class="coffee-stain bottom-right hover-stain"></div>
    </section>

    <section id="story" style="height: 100vh; background: #1a1a1a; display: flex; align-items: center; justify-content: center; color: #d4af37;">
        <h2 style="font-family: 'Cormorant Garamond', serif; font-size: 3rem;">THE LABORATORY</h2>
    </section>
    
    <script src="script.js"></script>
</body>
</html>
