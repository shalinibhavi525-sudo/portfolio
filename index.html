<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Shambhavi Singh | From Forest to Function</title>
    
    <!-- Link to your CSS file -->
    <link rel="stylesheet" href="styles.css">
    
    <!-- Google Fonts for the Academic/Elegant look -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,300;0,600;1,400&family=EB+Garamond:ital,wght@0,400;0,500;1,400&family=Pinyon+Script&display=swap" rel="stylesheet">
</head>
<body>

    <!-- HERO SECTION -->
    <section id="hero">
        <!-- The Stardust/Grain Layer -->
        <div class="stardust-overlay"></div>

        <!-- Decorative Elements -->
        <img src="coffee stain 1.png" class="asset stain-top-left" alt="">
        <img src="raven.png" class="asset raven-top-right" alt="">
        <img src="rose 1.png" class="asset rose-bottom-left" alt="">
        <img src="coffee stain 2.png" class="asset stain-bottom-mid" alt="">

        <div class="hero-content">
            <h2 class="hero-title">From Forest to Function</h2>
            
            <!-- Padding added here so 'g' never gets cut off -->
            <div class="name-wrapper">
                <h1 id="hero-name" class="gold-metallic">Shambhavi Singh</h1>
            </div>
            
            <p class="silver-tag-text">builder • researcher • forest dweller</p>
            
            <div class="button-container">
                <div class="ink-splash"></div>
                <button id="explore-btn" class="ink-button gold-accent">Explore</button>
            </div>
        </div>
    </section>

    <!-- Script File -->
    <script src="script.js"></script>
</body>
</html>
