<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Shambhavi Singh | Home</title>
    
    <!-- Google Fonts -->
    <link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,300;0,600;1,400&family=Pinyon+Script&display=swap" rel="stylesheet">
    
    <link rel="stylesheet" href="styles.css">
</head>
<body>

    <!-- Background Grain & Vignette -->
    <div class="paper-grain"></div>
    <div class="vignette"></div>

    <!-- Hero Page Assets -->
    <img src="raven.png" class="asset raven" alt="Raven">
    <img src="coffee stain 1.png" class="asset stain-top-left" alt="">
    <img src="coffee stain 2.png" class="asset stain-bottom-right" alt="">
    <img src="rose 1.png" class="asset rose-hero" alt="">

    <main class="hero">
        <div class="content">
            <p class="tagline">From Forest to Function</p>
            
            <h1 class="name">Shambhavi Singh</h1>
            
            <p class="roles">Builder &bull; Researcher &bull; Forest Dweller</p>
            
            <div class="location">
                <p>Teliamura Reserved Forest</p>
                <p>Tripura, India</p>
            </div>

            <div class="cta-wrapper">
                <a href="#" class="explore-btn">Explore the Work ↓</a>
                <!-- Ink splash appears on hover -->
                <img src="ink.png" class="ink-hover" alt="">
            </div>
        </div>
    </main>

    <script src="script.js"></script>
</body>
</html>
