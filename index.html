<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Shambhavi Singh - From Forest to Function</title>
    
    <!-- Google Fonts -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:wght@300;400;600&family=Lora:wght@400;500&family=Tangerine:wght@700&display=swap" rel="stylesheet">
    
    <link rel="stylesheet" href="styles.css">
</head>
<body>

    <section id="hero">
        <div class="paper-texture"></div>

        <img src="https://www.pngarts.com/files/3/Coffee-Stain-PNG-High-Quality-Image.png" 
             class="coffee-stain coffee-stain-1" alt="">
        <img src="https://www.pngarts.com/files/3/Coffee-Stain-PNG-High-Quality-Image.png" 
             class="coffee-stain coffee-stain-2" alt="">
        <img src="https://www.pngarts.com/files/3/Coffee-Stain-PNG-Picture.png" 
             class="coffee-stain coffee-stain-3 hover-stain" alt="">

        <div class="raven-container" id="raven">
            <img src="https://www.pngarts.com/files/3/Raven-PNG-Image-Background.png" 
                 alt="Raven" class="raven-img">
            <div class="raven-eyes">
                <div class="raven-eye left-eye"></div>
                <div class="raven-eye right-eye"></div>
            </div>
        </div>
        <div class="hero-content">
            <p class="hero-subtitle">From Forest to Function</p>
            
            <h1 class="hero-name">Shambhavi Singh</h1>
            
            <p class="hero-specs">Builder &nbsp;•&nbsp; Researcher &nbsp;•&nbsp; Forest Dweller</p>
            
            <p class="hero-location">Teliamura Reserved Forest<br>Tripura, India</p>
        </div>
        
        <div class="scroll-indicator" id="scrollBtn">
            <img src="https://www.pngarts.com/files/3/Ink-Splash-PNG-Pic.png" 
                 class="ink-splatter ink-1" alt="">
            <img src="https://www.pngarts.com/files/3/Black-Ink-Splash-PNG-Free-Download.png" 
                 class="ink-splatter ink-2" alt="">
            <img src="https://www.pngarts.com/files/3/Ink-Splash-Transparent-Image.png" 
                 class="ink-splatter ink-3" alt="">
            
            <span class="scroll-text">Explore the Work</span>
            <svg class="scroll-arrow" width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                <path d="M12 5v14M19 12l-7 7-7-7"/>
            </svg>
        </div>
        
    </section>

    <section id="story" style="height: 100vh; background: #1a1a1a; display: flex; align-items: center; justify-content: center; color: #d4af37;">
        <h2 style="font-family: 'Cormorant Garamond', serif; font-size: 3rem;">THE LABORATORY</h2>
    </section>
    
    <script src="script.js"></script>
</body>
</html>
