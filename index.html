<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Shambhavi Singh | Hero</title>

    <link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,300;0,400;0,600;1,400&family=Pinyon+Script&family=EB+Garamond:ital@0;1&display=swap" rel="stylesheet">
    
    <link rel="stylesheet" href="style.css">
</head>
<body>

    <div class="paper-overlay"></div>
    <div class="coffee-stain stain-top-left"></div>
    <div class="coffee-stain stain-hover-corner"></div> 

    <div class="raven">🦅</div>

    <main class="hero-container">
        <div class="content-box">
            <p class="tagline">From Forest to Function</p>
            
            <h1 class="name">Shambhavi Singh</h1>
            
            <div class="sub-header">
                <span>Builder</span>
                <span class="dot">•</span>
                <span>Researcher</span>
                <span class="dot">•</span>
                <span>Forest Dweller</span>
            </div>
            
            <div class="location-stamp">
                <p>Teliamura Reserved Forest</p>
                <p>Tripura, India</p>
            </div>

            <div class="cta-wrapper">
                <a href="#" class="explore-btn">
                    Explore the Work <span class="arrow">↓</span>
                </a>
                <div class="ink-splatters">
                    <svg viewBox="0 0 100 100" class="splat splat-1"><circle cx="50" cy="50" r="2" fill="black"/></svg>
                    <svg viewBox="0 0 100 100" class="splat splat-2"><circle cx="50" cy="50" r="1.5" fill="black"/></svg>
                    <svg viewBox="0 0 100 100" class="splat splat-3"><circle cx="50" cy="50" r="3" fill="black"/></svg>
                </div>
            </div>
        </div>
    </main>

</body>
</html>
