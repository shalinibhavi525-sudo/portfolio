<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Shambhavi Singh | Dark Academia</title>
    <link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,300;0,600;1,400&family=Pinyon+Script&family=EB+Garamond:ital@0;1&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="styles.css">
</head>
<body>

    <!-- This layer provides the 'rough paper' feel -->
    <div class="paper-texture"></div>
    <div class="vignette"></div>

    <!-- Realistic Raven Silhouette (SVG) -->
    <div class="raven-container">
        <svg viewBox="0 0 100 100" class="raven-svg">
            <path d="M90,20 C80,15 70,25 60,30 C50,35 40,30 30,40 C20,50 15,70 10,80 C20,85 40,85 50,75 C60,65 75,55 85,45 C90,40 95,25 90,20 Z M35,45 C32,45 30,42 30,40 C30,38 32,35 35,35 C38,35 40,38 40,40 C40,42 38,45 35,45 Z" fill="black"/>
        </svg>
    </div>

    <!-- Permanent Coffee Stains -->
    <div class="coffee-stain stain-1"></div>
    <div class="coffee-stain stain-2"></div>

    <main class="hero">
        <div class="content">
            <p class="tagline">From Forest to Function</p>
            <h1 class="name">Shambhavi Singh</h1>
            <p class="roles">Builder <span class="sep">•</span> Researcher <span class="sep">•</span> Forest Dweller</p>
            
            <div class="location">
                <span>Teliamura Reserved Forest</span>
                <span>Tripura, India</span>
            </div>

            <div class="cta-area">
                <a href="#" class="explore-btn">Explore the Work ↓</a>
                <!-- Ink splatters that appear on hover -->
                <div class="ink-splatter splatter-1"></div>
                <div class="ink-splatter splatter-2"></div>
            </div>
        </div>
    </main>

    <!-- SVG FILTER: This is what makes the coffee stains look 'rugged' and 'messy' -->
    <svg style="position: absolute; width: 0; height: 0;">
        <filter id="rugged-edge">
            <feTurbulence type="fractalNoise" baseFrequency="0.05" numOctaves="3" result="noise" />
            <feDisplacementMap in="SourceGraphic" in2="noise" scale="15" />
        </filter>
    </svg>

</body>
</html>
